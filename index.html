<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Mock vite-hmr WebSocket in sandbox preview where dev HMR is disabled
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          var MockWebSocket = function(url, protocols) {
            var isViteHmr = protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && url.indexOf('token=') !== -1 && url.indexOf('vite') !== -1);

            if (isViteHmr) {
              var target = new EventTarget();
              target.url = url;
              target.readyState = 1; // WebSocket.OPEN
              target.CONNECTING = 0;
              target.OPEN = 1;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.send = function() {};
              target.close = function() { target.readyState = 3; };
              setTimeout(function() {
                try {
                  target.dispatchEvent(new Event('open'));
                } catch (e) {}
              }, 0);
              return target;
            }
            return new RealWebSocket(url, protocols);
          };
          MockWebSocket.prototype = RealWebSocket.prototype;
          MockWebSocket.CONNECTING = 0;
          MockWebSocket.OPEN = 1;
          MockWebSocket.CLOSING = 2;
          MockWebSocket.CLOSED = 3;
          window.WebSocket = MockWebSocket;
        }

        window.addEventListener('error', function (e) {
          if (e && (e.message && e.message.indexOf('WebSocket') !== -1 || (e.filename && e.filename.indexOf('@vite/client') !== -1))) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (e && e.reason && String(e.reason).indexOf('WebSocket') !== -1) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
